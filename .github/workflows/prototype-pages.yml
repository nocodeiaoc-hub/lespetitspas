name: Prototype - GitHub Pages

# Deploie le prototype de design (/prototype) sur GitHub Pages.
# A activer une seule fois : Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main, staging]
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prototype-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      # Version de pnpm lue depuis "packageManager" du package.json a la racine du repo.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnostic
        run: |
          {
            echo "node $(node -v)"
            echo "pnpm $(pnpm -v)"
            echo "cwd $(pwd)"
            echo "files: $(ls -A | tr '\n' ' ')"
            echo "lockfile line1: $(head -1 pnpm-lock.yaml)"
          } | sed 's/^/::warning::/'

      # --ignore-workspace : /prototype est un projet autonome.
      # --ignore-scripts : evite ERR_PNPM_IGNORED_BUILDS (fatal en CI avec pnpm 11).
      - name: Install
        run: |
          set -o pipefail
          if ! pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts 2>&1 | tee /tmp/i.log; then
            tail -50 /tmp/i.log | sed 's/^/::error::/'
            exit 1
          fi

      - run: pnpm test

      - run: pnpm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
